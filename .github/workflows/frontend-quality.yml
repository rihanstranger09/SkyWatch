name: Frontend Quality Check

# Fast, credential-free gate that runs only when the dashboard changes.
# The frontend is an offline, single-file, dependency-free page - so the checks
# are: does it exist, does it still self-contain, does the embedded fallback
# status parse, and does the Pages publisher survive a dry run?

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'

permissions:
  contents: read

jobs:
  validate-frontend:
    name: Validate Dashboard Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Check dashboard bundle integrity
        run: |
          set -euo pipefail
          test -f frontend/index.html || { echo "frontend/index.html is missing"; exit 1; }
          python - <<'PY'
          import json, pathlib, re, sys

          html = pathlib.Path("frontend/index.html").read_text(encoding="utf-8")
          errors = []

          # Self-contained: the page must render from its own bytes. The only
          # permitted network requests are optional enhancements that fail safe -
          # the Leaflet map (falls back to the inline SVG engine) and webfonts
          # (fall back to the system stack).
          scripts = re.findall(r"<script[^>]+src\s*=\s*['\"]([^'\"]+)['\"][^>]*>", html, re.I)
          if any("leaflet" not in url for url in scripts):
              errors.append(f"unexpected external script source: {scripts}")
          if scripts and 'onerror="window.__noLeaflet=1"' not in html:
              errors.append("the CDN map library has no offline fallback")
          sheets = re.findall(r"<link[^>]+rel=['\"]stylesheet['\"][^>]*href=['\"]([^'\"]+)['\"]", html, re.I)
          allowed = ("https://fonts.googleapis.com/", "https://unpkg.com/leaflet@1.9.4/")
          if any(not url.startswith(allowed) for url in sheets):
              errors.append(f"unexpected external stylesheet: {sheets}")
          if "data:image/png;base64," not in html:
              errors.append("no embedded preview image found - run frontend/embed_assets.py")

          # the console itself must be present, not a stub
          for what, pattern in (("map host", r'id="world"'), ("stage strip", r'id="flow"'),
                                ("SVG map engine", r"<svg"), ("living background", r"@keyframes bdrift")):
              if not re.search(pattern, html, re.I):
                  errors.append(f"expected {what} in the dashboard ({pattern})")
          if 'class="balloon' not in html or 'class="bglayer' not in html:
              errors.append("the animated background layers are missing")

          for marker in ("__PIPELINE_STATUS_START__", "__EMBEDDED_ASSETS_START__"):
              if marker not in html:
                  errors.append(f"missing {marker} markers (publishing would not work)")

          data = pathlib.Path("frontend/pipeline-status.json")
          if data.exists():
              parsed = json.loads(data.read_text(encoding="utf-8"))
              for key in ("result", "image", "stages", "checks"):
                  if key not in parsed:
                      errors.append(f"fallback pipeline-status.json is missing '{key}'")
          else:
              errors.append("frontend/pipeline-status.json (embedded fallback) is missing")

          print(f"index.html: {len(html) / 1024:.1f} KiB")
          if errors:
              print("\n".join(f"FAIL: {e}" for e in errors))
              sys.exit(1)
          print("frontend bundle OK (self-contained, fallback data valid)")
          PY

      - name: Embedded assets are in sync with frontend/assets
        run: python frontend/embed_assets.py --check

      - name: Lint the frontend build tooling
        run: flake8 frontend/ tests/test_frontend_build.py --max-line-length=120 --ignore=E501,W503

      - name: Test the frontend build tooling
        run: pytest tests/test_frontend_build.py -q

      - name: Dry-run the Pages publisher and boot the artefact
        run: |
          set -euo pipefail
          python frontend/publish_status.py --site-dir _site --status frontend/pipeline-status.json
          test -f _site/index.html || { echo "publisher produced no index.html"; exit 1; }
          python - <<'PY'
          import pathlib
          text = pathlib.Path("_site/index.html").read_text(encoding="utf-8")
          assert "window.__PIPELINE_STATUS__ = {" in text, "status snapshot not injected"
          assert len(text) > 100_000, "published artefact looks truncated"
          print(f"published artefact OK ({len(text) / 1024:.1f} KiB)")
          PY
