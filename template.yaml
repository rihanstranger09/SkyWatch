AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SkyWatch ISR Processing Line - event-driven exploitation of EO imagery.
  Collection store (GeoTIFF) -> SQS (+DLQ) -> containerised worker (rasterio/GDAL,
  NDVI + NDWI) -> Cloud-Optimized GeoTIFF product + metadata record in DynamoDB.
  Single-region deployment, encrypted at rest, least-privilege worker role.

Parameters:
  ProcessedRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 365
    Description: Days before published COG products are expired from the product store (data-retention policy).
  FunctionMemorySize:
    Type: Number
    Default: 1536
    MinValue: 512
    MaxValue: 10240
    Description: Lambda memory in MB (CPU scales with memory; 1536 MB = ~1 vCPU).
  FunctionTimeout:
    Type: Number
    Default: 180
    MinValue: 30
    MaxValue: 900
    Description: Lambda timeout in seconds. Must stay below the queue visibility timeout.
  CreateDlqAlarm:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Create a CloudWatch alarm that fires whenever a collection lands in the dead-letter queue.

Conditions:
  CreateAlarm: !Equals [!Ref CreateDlqAlarm, 'true']

Resources:
  # ---------------------------------------------------------------------------
  # Storage: raw collections in, index products + preview renders out
  # ---------------------------------------------------------------------------
  RawImageryBucket:
    Type: AWS::S3::Bucket
    DependsOn: ImageryProcessingQueuePolicy
    Properties:
      BucketName: !Sub 'skywatch-isr-collections-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter3Days
            Status: Enabled
            ExpirationInDays: 3
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt ImageryProcessingQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .tif
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt ImageryProcessingQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .tiff
      Tags:
        - Key: Project
          Value: skywatch-isr-line

  ProcessedImageryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'skywatch-isr-products-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireProcessedOutputs
            Status: Enabled
            ExpirationInDays: !Ref ProcessedRetentionDays
      Tags:
        - Key: Project
          Value: skywatch-isr-line

  # ---------------------------------------------------------------------------
  # Messaging: buffered, retried and dead-lettered exploitation queue
  # ---------------------------------------------------------------------------
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: collection-processing-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: skywatch-isr-line

  ImageryProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: collection-processing-queue
      VisibilityTimeout: 360
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: skywatch-isr-line

  # Allows S3 to publish ObjectCreated notifications into the processing queue.
  ImageryProcessingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ImageryProcessingQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3Notifications
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ImageryProcessingQueue.Arn
            Condition:
              ArnEquals:
                # Built as a string on purpose: referencing the bucket here would create a
                # circular dependency with the bucket's own DependsOn on this policy.
                aws:SourceArn: !Sub 'arn:aws:s3:::skywatch-isr-collections-${AWS::AccountId}'

  # ---------------------------------------------------------------------------
  # Metadata: one record per processed raster (PAY_PER_REQUEST, TTL-enabled)
  # ---------------------------------------------------------------------------
  MetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CollectionMetadata
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ImageId
          AttributeType: S
      KeySchema:
        - AttributeName: ImageId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ExpiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: skywatch-isr-line

  # ---------------------------------------------------------------------------
  # Compute: container-image Lambda (GDAL + rasterio baked in)
  # ---------------------------------------------------------------------------
  GeospatialProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      MemorySize: !Ref FunctionMemorySize
      Timeout: !Ref FunctionTimeout
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          OUTPUT_BUCKET: !Ref ProcessedImageryBucket
          METADATA_TABLE: !Ref MetadataTable
          OUTPUT_PREFIX: products/
          PREVIEW_PREFIX: previews/
          WRITE_PREVIEW: 'true'
          RED_BAND: '1'
          GREEN_BAND: '2'
          NIR_BAND: '4'
          RECORD_TTL_DAYS: '30'
          LOG_LEVEL: INFO
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub 'skywatch-isr-collections-${AWS::AccountId}'
        - S3CrudPolicy:
            BucketName: !Sub 'skywatch-isr-products-${AWS::AccountId}'
        - DynamoDBCrudPolicy:
            TableName: !Ref MetadataTable
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ImageryProcessingQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./src
      DockerTag: latest

  # ---------------------------------------------------------------------------
  # Observability: alert (not in the failing path) when poison messages stack up
  # ---------------------------------------------------------------------------
  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateAlarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-dlq-not-empty'
      AlarmDescription: Messages landed in collection-processing-dlq; inspect the Lambda logs.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  CollectionStoreBucketName:
    Description: Upload GeoTIFFs here to start the pipeline.
    Value: !Ref RawImageryBucket
    Export:
      Name: !Sub '${AWS::StackName}-RawBucket'
  ProductStoreBucketName:
    Description: Processed COGs land in products/, PNG previews in previews/.
    Value: !Ref ProcessedImageryBucket
    Export:
      Name: !Sub '${AWS::StackName}-ProcessedBucket'
  ImageryProcessingQueueUrl:
    Description: SQS queue that feeds the geospatial Lambda.
    Value: !Ref ImageryProcessingQueue
  DeadLetterQueueUrl:
    Description: Inspect this queue when a raster repeatedly fails.
    Value: !Ref DeadLetterQueue
  MetadataTableName:
    Description: DynamoDB table holding one record per processed ImageId.
    Value: !Ref MetadataTable
  GeospatialProcessorFunctionName:
    Description: Container-image Lambda function name.
    Value: !Ref GeospatialProcessorFunction
  GeospatialProcessorFunctionArn:
    Description: Container-image Lambda function ARN.
    Value: !GetAtt GeospatialProcessorFunction.Arn
